# Render Blueprint for the LXL Driver web app (backend + static frontend
# served from the same process). Free tier.
#
# Custom domain: app.lubanaxpress.com. The owner already owns
# lubanaxpress.com on GoDaddy for his website, and the standalone site
# will live at app.lubanaxpress.com, leaving his main website untouched.
# No new domain purchase is needed. After the first deploy, add
# app.lubanaxpress.com as a custom domain in the Render dashboard
# (service → Settings → Custom Domain → Add Custom Domain); the owner
# then adds the DNS record Render shows at GoDaddy himself. Render
# provisions the TLS certificate automatically. The domain name is NOT
# hard-coded anywhere in the app or in this config — the site works on
# whatever host it is deployed under (same-origin API, no hard-coded host).
services:
  - type: web
    name: lxl-driver-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/setup/status
    envVars:
      - key: SEED_REAL_FLEET
        value: 1
      - key: DATA_DIR
        value: /var/data
    # --- Persistent disk: attached 2026-11-14 in the Render dashboard ---
    # (Starter $7/mo + 1 GB disk $0.25/mo = $7.25/mo). The disk is managed
    # in the dashboard — Render's Add Disk form has no name field, so the
    # disk is identified by its mount path /var/data, not by a name.
    # The database and uploads live on it now (DATA_DIR=/var/data), so
    # restarts and redeploys no longer wipe the accounts. Do NOT remove
    # the disk or change DATA_DIR back — the live database is on it.
    # disk:
    #   mountPath: /var/data
    #   sizeGB: 1
    # PORT is set automatically by Render — do not hard-code a port.
