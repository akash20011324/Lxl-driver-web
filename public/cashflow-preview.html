<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LXL Cash Flow — New Design Preview</title>
<style>
  :root{
    --blue:#1E40AF; --blue2:#3B82F6; --gold:#F2B705; --bg:#05070d;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --txt:#eef2f7; --dim:#9aa7b8; --in:#34d399; --out:#fb7185;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(1200px 600px at 70% -10%, rgba(30,64,175,.35), transparent 60%), var(--bg);
    color:var(--txt); font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:18px 16px 40px;}
  .wrap{max-width:1180px; margin:0 auto;}
  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .logo{font-weight:900; font-size:26px; letter-spacing:.5px; color:#fff;}
  .logo span{color:var(--gold);}
  h1{font-size:22px; font-weight:800;}
  .back{margin-left:auto; color:var(--gold); text-decoration:none; font-size:14px; border:1px solid rgba(242,183,5,.4);
    padding:7px 12px; border-radius:999px;}
  .notice{background:rgba(242,183,5,.1); border:1px solid rgba(242,183,5,.35); color:#ffe9a8;
    border-radius:12px; padding:10px 14px; font-size:13.5px; margin:10px 0 16px;}
  .monthbar{display:flex; align-items:center; gap:12px; margin:4px 0 16px;}
  .mbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:#fff; font-size:18px; cursor:pointer;}
  .mbtn:active{background:var(--blue);}
  .mlabel{font-size:19px; font-weight:800; min-width:170px; text-align:center;}
  .grid{display:grid; gap:14px;}
  .kpis{grid-template-columns:repeat(4, 1fr);}
  .two{grid-template-columns:1.15fr .85fr;}
  .trucks{grid-template-columns:1fr 1fr;}
  @media (max-width:900px){ .kpis{grid-template-columns:1fr 1fr;} .two,.trucks{grid-template-columns:1fr;} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px;
    backdrop-filter:blur(8px);}
  .klabel{font-size:12px; letter-spacing:1.2px; color:var(--dim); text-transform:uppercase; font-weight:700;}
  .kbig{font-size:31px; font-weight:900; margin-top:6px;}
  .ksub{font-size:13px; color:var(--dim); margin-top:3px;}
  .in{color:var(--in);} .out{color:var(--out);} .gold{color:var(--gold);}
  .bank{border-color:rgba(242,183,5,.45); background:linear-gradient(160deg, rgba(242,183,5,.13), rgba(255,255,255,.03));}
  h2{font-size:16px; font-weight:800; margin-bottom:12px;}
  h2 .dim{font-weight:600; font-size:12.5px;}
  .legend{display:flex; flex-direction:column; gap:7px; font-size:14px;}
  .lrow{display:flex; align-items:center; gap:9px;}
  .dot{width:11px; height:11px; border-radius:3px; flex:none;}
  .lrow .amt{margin-left:auto; font-weight:700;}
  .lrow .pct{color:var(--dim); width:44px; text-align:right; font-size:12.5px;}
  .donutwrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
  .bars{display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:8px;}
  .bcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end;}
  .bpair{display:flex; gap:3px; align-items:flex-end; height:110px;}
  .bar{width:13px; border-radius:4px 4px 0 0;}
  .blab{font-size:10.5px; color:var(--dim); text-align:center; line-height:1.25;}
  .tunit{font-size:21px; font-weight:900;}
  .tunit small{color:var(--dim); font-size:13px; font-weight:600;}
  .trow{display:flex; justify-content:space-between; font-size:14.5px; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,.07);}
  .trow:last-of-type{border-bottom:none;}
  .tprofit{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .tprofit .v{font-size:24px; font-weight:900;}
  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  td, th{padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left;}
  td.n, th.n{text-align:right; font-weight:700; white-space:nowrap;}
  .tag{font-size:10.5px; background:rgba(59,130,246,.2); color:#bcd6ff; border:1px solid rgba(59,130,246,.45);
    padding:1px 6px; border-radius:999px; margin-left:6px; vertical-align:1px;}
  .totals{display:flex; gap:10px; flex-wrap:wrap; align-items:baseline;}
  .totals .t{font-size:14px; color:var(--dim);}
  .totals .t b{color:var(--txt); font-size:17px;}
  .entry{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14.5px;}
  .entry .d{color:var(--dim); font-size:12.5px; width:86px; flex:none;}
  .entry .c{font-weight:700;}
  .entry .note{color:var(--dim); font-size:13px;}
  .entry .a{margin-left:auto; font-weight:800; white-space:nowrap;}
  .err{background:rgba(251,113,133,.12); border:1px solid rgba(251,113,133,.4); border-radius:12px; padding:14px; font-size:14.5px;}
  .spin{color:var(--dim); font-size:15px; padding:30px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">LXL<span>➤</span></div>
    <h1>Cash Flow</h1>
    <a class="back" href="/">← Back to portal</a>
  </header>
  <div class="notice">⭐ <b>New design preview</b> — this page reads your real books, live. Your current Cash Flow page is untouched. If you like this one, say the word and it becomes the Cash Flow page.</div>
  <div class="monthbar">
    <button class="mbtn" id="prevM">‹</button>
    <div class="mlabel" id="mLabel">…</div>
    <button class="mbtn" id="nextM">›</button>
  </div>
  <div id="root"><div class="spin">Loading your books…</div></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const money = (c, dec) => (c == null ? '—' : (c < 0 ? '-$' : '$') + Math.abs(c / 100).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }));
const PALETTE = ['#F2B705', '#3B82F6', '#34d399', '#a78bfa', '#fb7185', '#22d3ee', '#f97316', '#94a3b8', '#e879f9', '#84cc16'];
let cur = new Date(); cur = cur.toISOString().slice(0, 7);
let curKey = cur;

function monthName(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function shiftMonth(key, d) {
  const [y, m] = key.split('-').map(Number);
  const dt = new Date(y, m - 1 + d, 1);
  return dt.toISOString().slice(0, 7);
}
$('#prevM').onclick = () => { curKey = shiftMonth(curKey, -1); load(); };
$('#nextM').onclick = () => { curKey = shiftMonth(curKey, 1); load(); };

function donut(groups, total) {
  const R = 62, C = 2 * Math.PI * R;
  let off = 0, segs = '';
  groups.forEach((g, i) => {
    const frac = total > 0 ? g.amountCents / total : 0;
    const len = Math.max(frac * C - 2, 0);
    segs += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${PALETTE[i % PALETTE.length]}" stroke-width="21"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off += frac * C;
  });
  return `<svg width="160" height="160" viewBox="0 0 160 160">${segs}
    <text x="80" y="74" text-anchor="middle" fill="#9aa7b8" font-size="11" font-weight="700">MONEY OUT</text>
    <text x="80" y="95" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">${money(total)}</text></svg>`;
}

async function load() {
  $('#mLabel').textContent = monthName(curKey);
  const token = localStorage.getItem('lxl_token') || '';
  if (!token) {
    $('#root').innerHTML = '<div class="err">You are not signed in on this browser. Open the portal, sign in, then reload this page.</div>';
    return;
  }
  let d;
  try {
    const r = await fetch('/api/cashflow?month=' + curKey, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) {
    $('#root').innerHTML = '<div class="err">Could not load the books (' + e.message + '). Reload to try again.</div>';
    return;
  }
  const m = d.month, bb = d.bankBalance;
  const profitCls = m.profitCents >= 0 ? 'in' : 'out';
  const outGroups = [...m.outGroups].sort((a, b) => b.amountCents - a.amountCents);
  const legend = outGroups.map((g, i) => `<div class="lrow"><span class="dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
    <span>${g.category}${g.fixed ? '<span class="tag">fixed</span>' : ''}</span>
    <span class="amt">${money(g.amountCents)}</span><span class="pct">${m.outTotalCents ? Math.round(g.amountCents / m.outTotalCents * 100) + '%' : ''}</span></div>`).join('');
  const maxW = Math.max(1, ...d.weekly.map(w => Math.max(w.inCents, w.outCents)));
  const bars = d.weekly.map(w => {
    const ih = Math.round(w.inCents / maxW * 108), oh = Math.round(w.outCents / maxW * 108);
    const lab = new Date(w.weekStart + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<div class="bcol"><div class="bpair"><div class="bar" style="height:${ih}px;background:var(--in)"></div><div class="bar" style="height:${oh}px;background:var(--out)"></div></div><div class="blab">${lab}</div></div>`;
  }).join('');
  const truckCards = (d.truckMonthly || []).map(t => {
    const pc = t.profitCents >= 0 ? 'in' : 'out';
    const margin = t.revenueCents > 0 ? Math.round(t.profitCents / t.revenueCents * 100) : 0;
    return `<div class="card"><div class="tunit">Truck ${t.unitNumber} <small>· ${t.loadsInMonth} loads this month</small></div>
      <div class="trow"><span>Revenue (loads)</span><b class="in">${money(t.revenueCents)}</b></div>
      <div class="trow"><span>Fuel (Pilot)</span><b>${money(t.fuelCents)}</b></div>
      <div class="trow"><span>Driver pay</span><b>${money(t.driverPayCents)}</b></div>
      <div class="trow"><span>Maintenance &amp; repairs</span><b>${money(t.maintCents)}</b></div>
      <div class="trow"><span>Other costs</span><b>${money(t.otherCents)}</b></div>
      <div class="tprofit"><span class="klabel">Truck profit</span><span class="v ${pc}">${money(t.profitCents)} <small style="font-size:13px;color:var(--dim)">${margin}% margin</small></span></div></div>`;
  }).join('');
  const inRows = m.inGroups.map(g => `<tr><td>${g.category}</td><td class="n in">${money(g.amountCents, 1)}</td></tr>`).join('') || '<tr><td class="note">Nothing in this month</td><td></td></tr>';
  const outRows = outGroups.map(g => `<tr><td>${g.category}${g.fixed ? '<span class="tag">fixed monthly</span>' : ''}</td><td class="n out">${money(g.amountCents, 1)}</td></tr>`).join('') || '<tr><td>Nothing out this month</td><td></td></tr>';
  const entries = (d.entries || []).slice(0, 20).map(e => `<div class="entry"><span class="d">${e.date || ''}</span>
    <span><span class="c">${e.category}</span>${e.note ? ' <span class="note">' + String(e.note).slice(0, 60) + '</span>' : ''}${e.truckUnit ? ' <span class="note">· Truck ' + e.truckUnit + '</span>' : ''}</span>
    <span class="a ${e.direction === 'in' ? 'in' : 'out'}">${e.direction === 'in' ? '+' : '−'}${money(e.amountCents, 1)}</span></div>`).join('');
  const fixedList = (d.fixed || []).map(f => `<div class="lrow"><span class="dot" style="background:var(--blue2)"></span><span>${f.category}${f.note ? ' — ' + f.note : ''}</span><span class="amt">${money(f.amountCents)}/mo</span></div>`).join('') || '<div class="note">No fixed payments set</div>';
  const netCls = d.netCents >= 0 ? 'in' : 'out';
  const bankUpd = bb && bb.at ? new Date(bb.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

  $('#root').innerHTML = `
  <div class="grid kpis">
    <div class="card"><div class="klabel">Money in · ${monthName(curKey)}</div><div class="kbig in">${money(m.inTotalCents)}</div><div class="ksub">Factoring &amp; payments received</div></div>
    <div class="card"><div class="klabel">Money out · ${monthName(curKey)}</div><div class="kbig out">${money(m.outTotalCents)}</div><div class="ksub">All expenses incl. fixed monthly</div></div>
    <div class="card"><div class="klabel">Profit · ${monthName(curKey)}</div><div class="kbig ${profitCls}">${money(m.profitCents)}</div><div class="ksub">In minus out for the month</div></div>
    <div class="card bank"><div class="klabel gold">Bank balance · BofA ••${bb ? (bb.mask || '1214') : '1214'}</div><div class="kbig gold">${bb ? money(bb.currentCents) : '—'}</div><div class="ksub">${bb ? 'Available ' + money(bb.availableCents) + ' · Updated ' + bankUpd : 'Not connected'}</div></div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Where the money went <span class="dim">— ${monthName(curKey)}</span></h2>
      <div class="donutwrap">${donut(outGroups, m.outTotalCents)}<div class="legend" style="flex:1;min-width:210px">${legend}</div></div></div>
    <div class="card"><h2>Last 8 weeks <span class="dim">— green in · red out</span></h2><div class="bars">${bars}</div>
      <div class="ksub" style="margin-top:8px">Booked on rate cons (all time): <b class="gold">${money(d.bookedCents)}</b></div></div>
  </div>

  <div class="grid trucks" style="margin-top:14px">${truckCards}</div>

  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Money in by category</h2><table>${inRows}</table></div>
    <div class="card"><h2>Money out by category</h2><table>${outRows}</table></div>
  </div>

  <div class="card" style="margin-top:14px"><h2>Company totals <span class="dim">— since May 2026</span></h2>
    <div class="totals">
      <span class="t">Received <b class="in">${money(d.receivedCents)}</b></span>
      <span class="t">Paid out <b class="out">${money(d.outCents)}</b></span>
      <span class="t">Net <b class="${netCls}">${money(d.netCents)}</b></span>
      <span class="t">Booked <b class="gold">${money(d.bookedCents)}</b></span>
    </div></div>

  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Recent entries</h2>${entries || '<div class="note">No entries yet</div>'}</div>
    <div class="card"><h2>Fixed monthly payments <span class="dim">— counted automatically</span></h2><div class="legend">${fixedList}</div>
      <div class="ksub" style="margin-top:10px">Bank inbox waiting: <b>${(d.bankPending || []).length}</b> to categorize</div></div>
  </div>`;
}
load();
</script>
</body>
</html>
