<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LXL Cash Flow — Design 4 · Route</title>
<style>
  :root{ --blue:#1E40AF; --blue2:#3B82F6; --gold:#F2B705; --bg:#060a12; --panel:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.1); --txt:#eef2f7; --dim:#9aa7b8; --in:#34d399; --out:#fb7185; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(900px 480px at 85% -5%, rgba(30,64,175,.4), transparent 60%), var(--bg);
    color:var(--txt); font-family:-apple-system, "Segoe UI", Roboto, sans-serif; padding:18px 16px 42px;}
  .wrap{max-width:980px; margin:0 auto;}
  header{display:flex; align-items:center; gap:13px; flex-wrap:wrap;}
  .logo{font-weight:900; font-size:25px;} .logo span{color:var(--gold);}
  h1{font-size:21px; font-weight:800;}
  .back{margin-left:auto; color:var(--gold); text-decoration:none; font-size:13.5px; border:1px solid rgba(242,183,5,.4); padding:7px 12px; border-radius:999px;}
  .notice{background:rgba(242,183,5,.1); border:1px solid rgba(242,183,5,.35); color:#ffe9a8; border-radius:12px; padding:9px 13px; font-size:13px; margin:12px 0 6px;}
  .monthbar{display:flex; align-items:center; gap:11px; margin:12px 0 18px;}
  .mbtn{width:37px; height:37px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:#fff; font-size:18px; cursor:pointer;}
  .mlabel{font-size:18px; font-weight:800; min-width:165px; text-align:center;}
  .route{position:relative; margin:6px 0 0 12px; padding-left:34px;}
  .route:before{content:""; position:absolute; left:9px; top:8px; bottom:8px; width:3px; border-radius:3px;
    background:repeating-linear-gradient(180deg, var(--gold) 0 12px, rgba(242,183,5,.25) 12px 20px);}
  .stop{position:relative; padding:11px 0;}
  .stop:before{content:""; position:absolute; left:-32px; top:16px; width:15px; height:15px; border-radius:50%;
    background:var(--bg); border:3.5px solid var(--gold);}
  .stop.in:before{border-color:var(--in);} .stop.out:before{border-color:var(--out);}
  .stop.end:before{border-color:#fff; background:var(--gold);}
  .scard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .sname{font-weight:800; font-size:16px;}
  .snote{color:var(--dim); font-size:13px;}
  .samt{margin-left:auto; font-size:19px; font-weight:900; white-space:nowrap;}
  .in{color:var(--in);} .out{color:var(--out);} .gold{color:var(--gold);}
  .hero{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:8px;}
  @media (max-width:760px){ .hero{grid-template-columns:1fr;} }
  .hcell{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 17px;}
  .hlab{font-size:11.5px; letter-spacing:1.3px; color:var(--dim); text-transform:uppercase; font-weight:700;}
  .hval{font-size:27px; font-weight:900; margin-top:4px;}
  .sect{font-size:13px; letter-spacing:1.6px; color:var(--dim); text-transform:uppercase; font-weight:800; margin:20px 0 2px;}
  .truckrow{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  @media (max-width:760px){ .truckrow{grid-template-columns:1fr;} }
  .tcard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 17px;}
  .tcard .tu{font-size:19px; font-weight:900;}
  .tcard .tp{float:right; font-size:20px; font-weight:900;}
  .tline{display:flex; justify-content:space-between; font-size:14px; padding:3.5px 0; color:#dbe4f0;}
  .err{background:rgba(251,113,133,.12); border:1px solid rgba(251,113,133,.4); border-radius:12px; padding:14px; font-size:14.5px;}
  .spin{color:var(--dim); text-align:center; padding:32px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">LXL<span>➤</span></div>
    <h1>Cash Flow — The Route</h1>
    <a class="back" href="/">← Back to portal</a>
  </header>
  <div class="notice">⭐ <b>Design 4 · Route preview</b> — your month drawn like a trip: money in and money out as stops on the road. Real, live books; your current Cash Flow page is untouched.</div>
  <div class="monthbar">
    <button class="mbtn" id="prevM">‹</button>
    <div class="mlabel" id="mLabel">…</div>
    <button class="mbtn" id="nextM">›</button>
  </div>
  <div id="root"><div class="spin">Loading your books…</div></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const money = (c, dec) => (c == null ? '—' : (c < 0 ? '-$' : '$') + Math.abs(c / 100).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }));
let curKey = new Date().toISOString().slice(0, 7);
function monthName(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
function shiftMonth(key, d) { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1 + d, 1).toISOString().slice(0, 7); }
$('#prevM').onclick = () => { curKey = shiftMonth(curKey, -1); load(); };
$('#nextM').onclick = () => { curKey = shiftMonth(curKey, 1); load(); };

async function load() {
  $('#mLabel').textContent = monthName(curKey);
  const token = localStorage.getItem('lxl_token') || '';
  if (!token) { $('#root').innerHTML = '<div class="err">You are not signed in on this browser. Open the portal, sign in, then reload this page.</div>'; return; }
  let d;
  try {
    const r = await fetch('/api/admin/cashflow?month=' + curKey, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) { $('#root').innerHTML = '<div class="err">Could not load the books (' + e.message + '). Reload to try again.</div>'; return; }
  const m = d.month, bb = d.bankBalance;
  let running = 0;
  const stops = [];
  stops.push(`<div class="stop"><div class="scard"><span class="sname">🟢 Start of ${monthName(curKey)}</span><span class="snote">Money in minus money out, stop by stop</span><span class="samt">$0</span></div></div>`);
  const seq = [
    ...m.inGroups.map(g => ({ ...g, dir: 'in' })),
    ...m.outGroups.map(g => ({ ...g, dir: 'out' })),
  ].sort((a, b) => b.amountCents - a.amountCents);
  for (const g of seq) {
    running += g.dir === 'in' ? g.amountCents : -g.amountCents;
    stops.push(`<div class="stop ${g.dir}"><div class="scard">
      <span class="sname">${g.dir === 'in' ? '💵' : '🛑'} ${g.category}${g.fixed ? ' · fixed monthly' : ''}</span>
      <span class="snote">running total ${money(running)}</span>
      <span class="samt ${g.dir === 'in' ? 'in' : 'out'}">${g.dir === 'in' ? '+' : '−'}${money(g.amountCents)}</span></div></div>`);
  }
  stops.push(`<div class="stop end"><div class="scard" style="border-color:rgba(242,183,5,.5)"><span class="sname">🏁 End of ${monthName(curKey)} — ${m.profitCents >= 0 ? 'profit' : 'loss'}</span><span class="snote">after every stop</span><span class="samt ${m.profitCents >= 0 ? 'in' : 'out'}">${money(m.profitCents)}</span></div></div>`);
  const trucks = (d.truckMonthly || []).map(t => `<div class="tcard"><span class="tp ${t.profitCents >= 0 ? 'in' : 'out'}">${money(t.profitCents)}</span>
    <div class="tu">🚛 Truck ${t.unitNumber}</div>
    <div class="tline"><span>Revenue · ${t.loadsInMonth} loads</span><b class="in">${money(t.revenueCents)}</b></div>
    <div class="tline"><span>Fuel</span><b>${money(t.fuelCents)}</b></div>
    <div class="tline"><span>Driver pay</span><b>${money(t.driverPayCents)}</b></div>
    <div class="tline"><span>Maintenance &amp; repairs</span><b>${money(t.maintCents)}</b></div>
    <div class="tline"><span>Other</span><b>${money(t.otherCents)}</b></div></div>`).join('');
  const bankUpd = bb && bb.at ? new Date(bb.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  $('#root').innerHTML = `
  <div class="hero">
    <div class="hcell"><div class="hlab">Money in · ${monthName(curKey)}</div><div class="hval in">${money(m.inTotalCents)}</div></div>
    <div class="hcell"><div class="hlab">Money out · ${monthName(curKey)}</div><div class="hval out">${money(m.outTotalCents)}</div></div>
    <div class="hcell"><div class="hlab">Bank · BofA ••${bb ? (bb.mask || '1214') : '1214'}</div><div class="hval gold">${bb ? money(bb.currentCents) : '—'}</div><div style="color:var(--dim);font-size:12.5px">Avail ${bb ? money(bb.availableCents) : '—'} · ${bankUpd}</div></div>
  </div>
  <div class="sect">The route — biggest stops first</div>
  <div class="route">${stops.join('')}</div>
  <div class="sect">By truck — ${monthName(curKey)}</div>
  <div class="truckrow">${trucks}</div>
  <div class="sect">Company since May 2026</div>
  <div class="hcell" style="margin-top:8px; font-size:15px">Received <b class="in">${money(d.receivedCents)}</b> &nbsp;·&nbsp; Paid out <b class="out">${money(d.outCents)}</b> &nbsp;·&nbsp; Net <b class="${d.netCents >= 0 ? 'in' : 'out'}">${money(d.netCents)}</b> &nbsp;·&nbsp; Booked <b class="gold">${money(d.bookedCents)}</b></div>`;
}
load();
</script>
</body>
</html>
